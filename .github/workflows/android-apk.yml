
name: Eternal Clash Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EternalClash_Unity_Starter_v2.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Unity project
        id: prepare
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-source
          unzip -q EternalClash_Unity_Starter_v2.zip -d build-source
          ASSETS_DIR="$(find build-source -type d -name Assets -print -quit)"
          test -n "$ASSETS_DIR"
          PROJECT_PATH="$(dirname "$ASSETS_DIR")"
          mkdir -p "$PROJECT_PATH/ProjectSettings" "$PROJECT_PATH/Packages"
          echo "m_EditorVersion: 2022.3.62f1" > "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
          cat > "$PROJECT_PATH/Packages/manifest.json" <<'EOF'
          {
            "dependencies": {
              "com.unity.modules.ai": "1.0.0",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.ui": "1.0.0"
            }
          }
          EOF
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ steps.prepare.outputs.project_path }}
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildsPath: build
          buildName: EternalClash
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EternalClash-Android-APK
          path: build/Android
          if-no-files-found: error
